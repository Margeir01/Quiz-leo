<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IT-drift Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- MENY -->
  <div class="wrap" id="menu">
    <div class="card">
      <h1>IT-drift Quiz</h1>

      <div class="menu-group">
        <label for="questionCount">Antall spørsmål</label>
        <select id="questionCount">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="15">15</option>
          <option value="20">20</option>
        </select>
      </div>

      <div class="menu-group">
        <label for="difficulty">Vanskelighetsgrad</label>
        <select id="difficulty">
          <option value="all">Alle</option>
          <option value="easy">Lett</option>
          <option value="medium">Medium</option>
          <option value="hard">Vanskelig</option>
        </select>
      </div>

      <button class="btn primary" id="startBtn">Start quiz</button>

      <p id="menuInfo" class="menu-info"></p>
    </div>
  </div>

  <!-- QUIZ -->
  <div class="wrap hidden" id="quizApp">
    <div class="card">
      <div class="top">
        <h1>IT-drift Quiz</h1>
        <div class="meta" id="meta"></div>
      </div>

      <div class="bar"><div id="progress"></div></div>

      <div class="q" id="question"></div>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>

      <div class="controls">
        <button class="btn" id="restart">Til meny</button>
        <button class="btn primary" id="next" disabled>Neste</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
